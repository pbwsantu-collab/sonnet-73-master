<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1423" />
  <meta name="description" content="Sonnet 73 Master — Interactive bilingual study app for Class XII Bengali Medium (West Bengal, India). Read, understand, analyse Shakespeare’s Sonnet 73." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <title>Sonnet 73 Master | S73 Master</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="navbar" id="navbar">
      <div class="nav-brand" onclick="navigate('home')">
        <span class="brand-icon">📜</span>
        <span class="brand-text">S73 <span>Master</span></span>
      </div>
      <button class="hamburger" id="hamburger" aria-label="Menu" onclick="toggleMenu()">
        <span></span><span></span><span></span>
      </button>
      <nav class="nav-links" id="navLinks">
        <a data-page="home" class="active">🏠 Home</a>
        <a data-page="poet">👤 Poet</a>
        <a data-page="about">📜 About Sonnet</a>
        <a data-page="poem">📖 Poem</a>
        <a data-page="vocab">🔤 Word Explorer</a>
        <a data-page="bangla">🇮🇳 বাংলা অর্থ</a>
        <a data-page="analysis">🔍 Line Analysis</a>
        <a data-page="devices">🎭 Devices</a>
        <a data-page="themes">💡 Themes</a>
        <a data-page="background">🏛 Background</a>
        <a data-page="critical">🧠 Critical</a>
        <a data-page="exam">📝 Exam Qs</a>
        <a data-page="quiz">❓ Quiz</a>
        <a data-page="revision">🔄 Revision</a>
        <a data-page="progress">⭐ Progress</a>
      </nav>
    </header>

    <div class="toolbar sticky-tools">
      <div class="lang-switch" id="langSwitch">
        <button data-lang="en" class="active">EN</button>
        <button data-lang="bn">বাংলা</button>
        <button data-lang="both">BOTH</button>
      </div>
      <button class="tool-btn" id="simpleModeBtn" onclick="toggleSimpleMode()" title="Explain like Class V">🧒 Simple</button>
      <button class="tool-btn" onclick="speakCurrent()" title="Read aloud">🔊</button>
      <div class="progress-mini" id="progressMini">0%</div>
    </div>

    <main id="mainContent"></main>

    <div class="fab-bar" id="fabBar">
      <button onclick="navigate('vocab')" title="Vocabulary">🔤</button>
      <button onclick="navigate('bangla')" title="বাংলা (India)">🇮🇳</button>
      <button onclick="speakCurrent()" title="Audio">🔊</button>
      <button onclick="openNotes()" title="Notes">📝</button>
      <button onclick="openSearch()" title="Search">🔍</button>
    </div>

    <div class="modal" id="wordModal" hidden>
      <div class="modal-card">
        <button class="modal-close" onclick="closeModal('wordModal')">×</button>
        <div id="wordModalBody"></div>
      </div>
    </div>

    <div class="sheet" id="lineSheet" hidden>
      <div class="sheet-handle"></div>
      <div class="sheet-body" id="lineSheetBody"></div>
      <button class="sheet-close" onclick="closeSheet()">Close</button>
    </div>

    <div class="modal" id="searchModal" hidden>
      <div class="modal-card wide">
        <button class="modal-close" onclick="closeModal('searchModal')">×</button>
        <input type="search" id="globalSearch" placeholder="Search poem, words, themes, devices…" autocomplete="off" />
        <div id="searchResults"></div>
      </div>
    </div>

    <div class="modal" id="notesModal" hidden>
      <div class="modal-card">
        <button class="modal-close" onclick="closeModal('notesModal')">×</button>
        <h3>My Notes</h3>
        <textarea id="noteInput" rows="4" placeholder="Write a note…"></textarea>
        <button class="btn primary" onclick="saveNote()">Save Note</button>
        <div id="notesList"></div>
      </div>
    </div>

    <div class="offline-badge" id="offlineBadge" hidden>Offline mode</div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
